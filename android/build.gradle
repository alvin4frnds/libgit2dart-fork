group 'com.github.libgit2dart'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace "com.github.libgit2dart"
    }

    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
    }

    // jniLibs are packaged automatically from src/main/jniLibs/<abi>/
    // We ship libgit2.so here; libgit2dart's Dart FFI layer loads it via
    // DynamicLibrary.open("libgit2.so") at runtime.
}
